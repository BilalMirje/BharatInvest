# Server
server.port=8080

## MySQL Database
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bharatinvest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD:your_mysql_password}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.url=jdbc:postgresql://HOST:PORT/DATABASE
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver



# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET:change_this_to_a_random_secret_key}
app.jwt.expiration-ms=86400000

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Gemini AI
app.gemini.api-key=${GEMINI_API_KEY:your_gemini_api_key}
app.gemini.model=gemini-3.8-flash

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}